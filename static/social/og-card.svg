<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Supply Chain Research - SEC-grounded semiconductor supply chain intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="55%" stop-color="#070809"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="flow-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0"/>
      <stop offset="35%" stop-color="#76b900" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="flow-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="die-iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="22%" stop-color="#818cf8"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="68%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative Sankey-style flows -->
  <g fill="none" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <path d="M-40 420 C 220 360, 360 500, 560 430" stroke="url(#flow-a)"/>
    <path d="M80 520 C 300 470, 420 560, 640 500" stroke="url(#flow-b)" opacity="0.7"/>
    <path d="M120 300 C 340 260, 480 360, 700 310" stroke="url(#flow-a)" opacity="0.45"/>
  </g>

  <!-- Accent bar -->
  <rect x="72" y="72" width="6" height="88" rx="3" fill="url(#accent)"/>

  <!-- Title block -->
  <text x="96" y="118" fill="#f4f4f5" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.02em">Supply Chain</text>
  <text x="96" y="178" fill="#f4f4f5" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.02em">Research</text>

  <text x="96" y="248" fill="#a1a1aa" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400">
    <tspan>Reverse-traced semiconductor supply chains</tspan>
    <tspan x="96" dy="38">from SEC 10-K and 20-F filings</tspan>
  </text>

  <!-- Feature pills -->
  <g font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="96" y="360" width="168" height="40" rx="20" fill="#76b900" fill-opacity="0.14" stroke="#76b900" stroke-opacity="0.35"/>
    <text x="180" y="386" fill="#d9f99d" text-anchor="middle">Sankey maps</text>

    <rect x="280" y="360" width="168" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="364" y="386" fill="#d4d4d8" text-anchor="middle">Filing evidence</text>

    <rect x="464" y="360" width="168" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="548" y="386" fill="#d4d4d8" text-anchor="middle">Rare earth REE</text>
  </g>

  <text x="96" y="548" fill="#71717a" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500">20 topics | 18 SEC tickers | Interactive charts &amp; RAG search</text>
  <text x="96" y="586" fill="#76b900" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600">github.com/eugenehp/supplychain</text>

  <!-- Large chip illustration (scaled favicon motif) -->
  <g transform="translate(760 118) scale(7.2)">
    <rect width="32" height="32" rx="8" fill="#0a0a0a" opacity="0.9"/>
    <rect x="2.2" y="3.2" width="27.6" height="25.6" rx="1.2" fill="#141414" stroke="#2e2e2e" stroke-width="0.35"/>
    <g fill="#ca8a04" fill-opacity="0.75">
      <rect x="10" y="3.35" width="0.55" height="1.1" rx="0.1"/>
      <rect x="12.4" y="3.35" width="0.55" height="1.1" rx="0.1"/>
      <rect x="14.8" y="3.35" width="0.55" height="1.1" rx="0.1"/>
      <rect x="17.2" y="3.35" width="0.55" height="1.1" rx="0.1"/>
      <rect x="19.6" y="3.35" width="0.55" height="1.1" rx="0.1"/>
    </g>
    <g fill="#242424" stroke="#333" stroke-width="0.12">
      <rect x="5.2" y="8.2" width="0.9" height="0.45" rx="0.08"/>
      <rect x="23.5" y="8.2" width="0.9" height="0.45" rx="0.08"/>
      <rect x="5.2" y="23.3" width="0.9" height="0.45" rx="0.08"/>
    </g>
    <g fill="#1f1f1f" stroke="#383838" stroke-width="0.12">
      <rect x="3.4" y="10.8" width="2.3" height="1.25" rx="0.12"/>
      <rect x="3.4" y="15.45" width="2.3" height="1.25" rx="0.12"/>
      <rect x="26.3" y="10.8" width="2.3" height="1.25" rx="0.12"/>
      <rect x="26.3" y="15.45" width="2.3" height="1.25" rx="0.12"/>
    </g>
    <g>
      <rect x="6.4" y="11.2" width="7.8" height="9" rx="0.35" fill="#6b7280"/>
      <rect x="7.2" y="12" width="6.2" height="7.4" rx="0.2" fill="#0a0a0a"/>
      <rect x="8.6" y="13.4" width="3.4" height="3.8" rx="0.15" fill="url(#die-iris)"/>
    </g>
    <g>
      <rect x="17.8" y="11.2" width="7.8" height="9" rx="0.35" fill="#6b7280"/>
      <rect x="18.6" y="12" width="6.2" height="7.4" rx="0.2" fill="#0a0a0a"/>
      <rect x="20" y="13.4" width="3.4" height="3.8" rx="0.15" fill="url(#die-iris)"/>
    </g>
  </g>

  <!-- Soft glow behind chip -->
  <ellipse cx="920" cy="330" rx="180" ry="140" fill="#76b900" opacity="0.08" filter="url(#soft)"/>
</svg>
